<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panier - Cho7</title>
    <link href="/css/main.css" rel="stylesheet" />
    <link href="/css/panier.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link rel="icon" type="image/x-icon" href="/assets/imglogo/cho7.png" />
  </head>

  <body>
    <nav class="navbar">
      <button class="burger" id="boutonburger">☰</button>
      <a href="/" id="lienlogo">
        <img src="/assets/imglogo/cho7.png" alt="Logo du site" id="logosite" />
      </a>
      <ul class="menu" id="listemenu">
        <li><a href="/catalogue">Notre Catalogue</a></li>
        <li><a href="/suivi-commandes">Suivi Commande</a></li>
        <li><a href="/connexion">Connexion/Inscription</a></li>
        <li><a href="/about">À Propos</a></li>
      </ul>
      <div class="icones">
        <a href="/favoris">
          <img
            src="/assets/icons/favorite_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
            alt="Logo Favoris"
            id="logofavoris"
          />
        </a>
        <div class="conteneurprofil">
          <a href="/profil">
            <img
              src="/assets/icons/account_circle_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
              alt="Logo Utilisateur"
              id="logoutilisateur"
            />
          </a>
          <span id="pastille-verte" class="pastille"></span>
        </div>
        <div class="panier">
          <a href="/panier">
            <img
              src="/assets/icons/shopping_cart_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
              alt="Logo Panier"
              id="logopanier"
            />
            <div class="pointrouge">0</div>
          </a>
        </div>
      </div>
    </nav>

    <div id="panier-container">
      <h1 class="titre-page">Mon panier</h1>

      <!-- Liste des produits -->
      <div id="panier-liste">Chargement...</div>

      <!-- Récapitulatif -->
      <div id="panier-recap">
        <div class="recap-ligne">
          <span>Total</span>
          <span id="panier-total">0.00€</span>
        </div>
        <div class="recap-boutons">
          <button id="btn-vider" class="boutonannulation">
            Vider le panier
          </button>
          <button id="btn-valider" class="boutonvalidation">
            Valider la commande
          </button>
        </div>
      </div>
    </div>

    <script src="/script/main.js"></script>
    <script src="/modele/panier.js"></script>
    <script src="/vue/panier.js"></script>
    <script src="/controller/panier.js"></script>
  </body>
</html>
