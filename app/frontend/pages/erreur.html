<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erreur</title>
    <link href="/css/main.css" rel="stylesheet" />
    <link href="/css/erreur.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link rel="icon" type="image/x-icon" href="/assets/imglogo/cho7.png" />
  </head>

  <body>
    <nav class="navbar">
      <button class="burger" id="boutonburger">☰</button>
      <a href="/" id="lienlogo"
        ><img src="/assets/imglogo/cho7.png" alt="Logo du site" id="logosite"
      /></a>
      <ul class="menu" id="listemenu">
        <li><a href="/catalogue">Notre Catalogue</a></li>
        <li><a href="/suivi-commandes">Suivi Commande</a></li>
        <li><a href="/about">À Propos</a></li>
      </ul>
      <div class="icones">
        <a href="/favoris"
          ><img
            src="/assets/icons/favorite_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
            alt="Logo Favoris"
            id="logofavoris"
        /></a>
        <div class="conteneurprofil">
          <a href="/profil"
            ><img
              src="/assets/icons/account_circle_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
              alt="Logo Utilisateur"
              id="logoutilisateur"
          /></a>
          <span id="pastille-verte" class="pastille"></span>
        </div>
        <div class="panier">
          <a href="/panier">
            <img
              src="/assets/icons/shopping_cart_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
              alt="Logo Panier"
              id="logopanier"
            />
            <div class="pointrouge">0</div>
          </a>
        </div>
      </div>
    </nav>

    <main class="conteneur-erreur">
      <div class="contenu-erreur">
        <h1 class="code-erreur" id="code-erreur">404</h1>
        <h2 class="titre-erreur" id="titre-erreur">Page non trouvée</h2>
        <p class="message-erreur" id="message-erreur">
          Désolé, la page que vous recherchez n'existe pas ou a été supprimée.
        </p>
        <div class="icone-erreur">🧦</div>
        <div class="boutons-action">
          <a href="/" class="btn-accueil">Retour à l'accueil</a>
          <a href="/catalogue" class="btn-catalogue">Consulter le catalogue</a>
        </div>
      </div>
    </main>

    <script src="/script/main.js" type="module"></script>
    <script src="/script/erreur.js"></script>
  </body>
</html>
