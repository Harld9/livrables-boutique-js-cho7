<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon Profil</title>
    <link href="/css/main.css" rel="stylesheet" />
    <link href="/css/profil.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/assets/imglogo/cho7juste7.png"
    />
  </head>

  <body>
    <nav class="navbar">
      <button class="burger" id="boutonburger">☰</button>
      <a href="/" id="lienlogo"
        ><img src="/assets/imglogo/cho7.png" alt="Logo du site" id="logosite"
      /></a>
      <ul class="menu" id="listemenu">
        <li><a href="/catalogue">Notre Catalogue</a></li>
        <li><a href="/commandes">Suivi Commande</a></li>
        <li><a href="/about">À Propos</a></li>
      </ul>
      <div class="icones">
        <a href="/favoris"
          ><img
            src="/assets/icons/favorite_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
            alt="Logo Favoris"
            id="logofavoris"
        /></a>
        <div class="conteneurprofil">
          <a href="/profil"
            ><img
              src="/assets/icons/account_circle_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
              alt="Logo Utilisateur"
              id="logoutilisateur"
          /></a>
          <span id="pastille-verte" class="pastille"></span>
        </div>
        <div class="panier">
          <a href="/panier">
            <img
              src="/assets/icons/shopping_cart_24dp_111111_FILL0_wght400_GRAD0_opsz24.svg"
              alt="Logo Panier"
              id="logopanier"
            />
            <div class="pointrouge">0</div>
          </a>
        </div>
      </div>
    </nav>

    <main class="profil-section">
      <p class="profil-etiquette">Mon espace personnel</p>
      <h1 class="profil-titre">
        Bonjour, <span id="profil-prenom" class="italique"></span> 👋
      </h1>
      <p class="profil-soustitre">
        Retrouvez ici toutes vos informations personnelles.
      </p>

      <div class="profil-grille">
        <div class="profil-carte">
          <div class="profil-carte-contenu">
            <span class="profil-carte-label">Nom complet</span>
            <span class="profil-carte-valeur" id="profil-nom"></span>
          </div>
        </div>

        <div class="profil-carte">
          <div class="profil-carte-contenu">
            <span class="profil-carte-label">Adresse e-mail</span>
            <span class="profil-carte-valeur" id="profil-mail"></span>
          </div>
        </div>

        <div class="profil-carte">
          <div class="profil-carte-contenu">
            <span class="profil-carte-label">Téléphone</span>
            <span class="profil-carte-valeur" id="profil-tel"></span>
          </div>
        </div>
      </div>

      <div class="profil-section-dernieres-commandes">
        <h2 class="commandes-titre">Votre dernière commande</h2>
        <div id="derniere-commande" class="derniere-commande-container">
          <p class="commandes-vide">Aucune commande trouvée</p>
        </div>
        <a href="/commandes" class="btn-voir-commandes"
          >Voir toutes mes commandes →</a
        >
      </div>

      <div class="profil-boutons">
        <button class="btn-deconnexion" id="btn-deconnexion">
          Se déconnecter
        </button>
      </div>
    </main>
    <script src="/script/main.js"></script>
    <script src="/modele/commande.js"></script>
    <script src="/modele/utilisateur.js"></script>
    <script src="/vue/utilisateur.js"></script>
    <script src="/controller/utilisateur.js"></script>
  </body>
</html>
